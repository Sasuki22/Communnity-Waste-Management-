# ============================================================
# Community Waste Management System - Docker Compose
#
# Run from the project root:
#   docker compose up --build
#
# Services:
#   db   - MySQL 8 (stores users, pickups, issues, announcements, schedules)
#   web  - Apache + PHP (frontend) on http://localhost:8080
#   api  - Flask REST API on http://localhost:5000 (health and remaining API features)
#           Admin and resident dashboard schedule data uses MySQL community_db.schedules.
# ============================================================
name: community-waste-management

services:
  
  db:
    image: mysql:8.0
    container_name: cwms_db
    restart: unless-stopped

    # Connection para sa MySQL Workbench
    ports:
      - "127.0.0.1:3307:3306"

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-cwms_root_password}
      MYSQL_DATABASE: ${DB_DATABASE:-community_db}
      MYSQL_USER: ${MYSQL_USER:-cwms}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-cwms_password}

    volumes:
      - db_data:/var/lib/mysql
      - ./database/database.sql:/docker-entrypoint-initdb.d/01-database.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

    networks:
      - cwms_net


  phpmyadmin:
    image: phpmyadmin:latest
    container_name: cwms_phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cwms_net


  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cwms_web
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      # Inside Docker the MySQL hostname is the service name "db".
      DB_HOST: db
      DB_USERNAME: ${MYSQL_USER:-cwms}
      DB_PASSWORD: ${MYSQL_PASSWORD:-cwms_password}
      DB_DATABASE: ${DB_DATABASE:-community_db}
    volumes:
      # Bind-mount the project so PHP/CSS/JS edits appear without rebuild
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cwms_net

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cwms_api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      FLASK_HOST: 0.0.0.0
      FLASK_PORT: 5000
      FLASK_DEBUG: "False"
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:-change_me_in_production}
      # Flask API SQLite database lives in the /app/data volume (persistent)
      DATABASE_PATH: /app/data/community_waste.db
    volumes:
      # Persistent SQLite database (backend/community_waste.db)
      - sqlite_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health')\""]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - cwms_net

volumes:
  db_data:
  sqlite_data:

networks:
  cwms_net:
    driver: bridge